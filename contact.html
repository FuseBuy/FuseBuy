<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact FuseBuy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
      line-height: 1.6;
    }

    header {
      background: #111118;
      border-bottom: 1px solid #292929;
      padding: 18px 6%;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-size: 26px;
      font-weight: 800;
    }

    header span {
      color: #4f8cff;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 70px 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      color: #c8c8d0;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .contact-box {
      background: #15151d;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 25px;
      margin-top: 30px;
    }

    .contact-box a {
      color: #4f8cff;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 20px;
      background: #4f8cff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #292929;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">Fuse<span>Buy</span></a>
  </header>

  <main>
    <h1>Contact FuseBuy</h1>

    <p>
      Have a question, suggestion, or want to report an issue with our
      website? We'd love to hear from you.
    </p>

    <div class="contact-box">
      <p>
        Email us at:
      </p>

      <a href="mailto:fusebuy20@gmail.com">
        fusebuy20@gmail.com
      </a>
    </div>

    <a class="back" href="index.html">← Back to FuseBuy</a>
  </main>

  <footer>
    © 2026 FuseBuy. All rights reserved.
  </footer>

</body>
</html>
